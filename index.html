<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>📚 My Tasks</h1>
      <p>Keep track of assignments, projects and deadlines</p>
    </header>

    <section class="input-area">
      <input type="text" id="task-input" placeholder="Enter a new task…" autocomplete="off">
      <button id="add-btn">Add</button>
    </section>

    <section class="tasks">
      <h2>Upcoming Tasks</h2>
      <ul id="tasks-list"></ul>
    </section>

    <footer>
      <p>Double‑click a task to mark it complete.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
